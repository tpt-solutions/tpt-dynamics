# Lennard-Jones fluid on a cubic lattice, run with:
#   tptdyn simulate simulate.toml --report
# Validate first (no run) with:
#   tptdyn validate simulate.toml
#
# Units are MD units: nm, ps, kJ/mol, K, amu. Relative paths resolve against
# the directory that contains this file.

seed = 7
dt = 0.002
nsteps = 2000
temperature = 0.7

[system]
# A cubic lattice of cubic_cells^3 identical atoms. Replace with
# `structure = "start.gro"` to start from a .gro or .pdb file instead.
cubic_cells = 4
spacing = 1.6      # nm between lattice sites
mass = 1.0         # amu

[lennard_jones]
epsilon = 1.0      # kJ/mol
sigma = 1.0        # nm
modifier = "shift" # energy shifted to zero at the cutoff

[neighbour]
cutoff = 2.0       # nm
skin = 0.3         # nm Verlet buffer

# No thermostat: the run is microcanonical (NVE), so the energy drift in the
# report measures integration error. For constant temperature add, for example:
#   [thermostat]
#   kind = "v-rescale"
#   tau = 0.5        # ps coupling time

[output]
energy_interval = 10
energy_file = "energy.csv"          # step,time,kinetic,potential,total,temperature,pressure
trajectory_interval = 50
trajectory_file = "traj.bin"
