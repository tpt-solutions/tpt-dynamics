[package]
name = "tpt-dynamics-cli"
description = "The tptdyn command-line tool: simulate, analyze, histogram, completions and man pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "molecular-dynamics", "histogram", "analysis", "simulation"]
categories = ["command-line-utilities", "science", "simulation"]
publish = true

[[bin]]
name = "tptdyn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
log = "0.4.35"
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tpt-dynamics-core = { version = "0.1.0-dev", path = "../tpt-dynamics-core" }
tpt-dynamics-data = { version = "0.1.0-dev", path = "../tpt-dynamics-data", features = ["parquet"] }
tpt-dynamics-sim = { version = "0.1.0-dev", path = "../tpt-dynamics-sim" }

[lints]
workspace = true

# cargo-binstall fetches prebuilt archives from the GitHub release for tag v{version}.
# Archive names: tptdyn-v{version}-{target}.tar.gz (all targets except Windows) and
# tptdyn-v{version}-{target}.zip (Windows targets, via the overrides below). The
# `{ version }` and `{ target }` placeholders are filled in by cargo-binstall.
[package.metadata.binstall]
pkg-url = "https://github.com/tpt-solutions/tpt-dynamics/releases/download/v{ version }/tptdyn-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "tptdyn{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/tpt-solutions/tpt-dynamics/releases/download/v{ version }/tptdyn-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "https://github.com/tpt-solutions/tpt-dynamics/releases/download/v{ version }/tptdyn-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dev-dependencies]
