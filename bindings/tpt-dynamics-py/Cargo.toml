[package]
name = "tpt-dynamics-py"
description = "PyO3 Python bindings for tpt-dynamics: lazy frames, histograms and simulation runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
# Not published to crates.io; ships to PyPI via maturin (todo.md Phase 4).
publish = false

[lib]
# The Python extension module is `tpt_dynamics._tpt_dynamics` (see pyproject.toml).
name = "_tpt_dynamics"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
tpt-dynamics-data = { version = "0.1.0-dev", path = "../../tpt-dynamics-data" }
tpt-dynamics-sim = { version = "0.1.0-dev", path = "../../tpt-dynamics-sim" }

# ADR-007: PyO3 and rust-numpy generate unsafe glue. This crate alone overrides
# the workspace `unsafe_code = "forbid"`. Hand-written code here stays safe
# (`#![deny(unsafe_code)]` in src/lib.rs). All other workspace lints are kept.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
